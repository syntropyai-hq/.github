name: Proposal
description: A change to behaviour, design or scope, before any code is written.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What doesn't work today, and who it affects. Point at the document or code involved.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: What would change, and what it would cost in code, compute or maintenance.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Measurements or sources behind the proposal. Label each number as a target, an estimate or a measurement.
